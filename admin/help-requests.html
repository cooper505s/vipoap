<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VIPOAP OS"><meta name="theme-color" content="#102957"><link rel="apple-touch-icon" href="/assets/vipoap-os-icon-192.png?v=4"><title>Customer requests | VIPOAP OS</title><link rel="icon" href="/assets/vipoap-os-icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="workspace.css?v=7"><link rel="stylesheet" href="operations-layout.css?v=1"></head><body data-workspace="admin" data-page-permission="manage_followups"><main class="workspace-main" id="main-content"><header class="page-heading"><div><h1>Customer requests</h1><p>Review customer conversations and arrange the next step.</p></div><button type="button" class="button" id="refreshRequests">Refresh</button></header><section class="panel" aria-label="Customer request queue"><div class="queue-toolbar"><div class="search-field"><label for="requestSearch">Search customers or references</label><input id="requestSearch" type="search" placeholder="Name, reference, email or phone"></div><div><label for="requestFilter">Status</label><select id="requestFilter"><option value="">All statuses</option><option value="received">Received</option><option value="looking">Looking at this</option><option value="information">Need information</option><option value="arranged">Visit arranged</option><option value="completed">Completed</option></select></div><span id="requestCount" class="fine-print" role="status">Loading…</span></div><div class="operations-table-wrap"><table class="operations-table"><thead><tr><th scope="col">Reference</th><th scope="col">Customer</th><th scope="col">Request</th><th scope="col">Status</th><th scope="col">Updated</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody id="requestRows"></tbody></table></div><div id="requestPagination" class="record-pagination" hidden></div><p id="requestStatus" class="panel-body" role="status"></p></section><dialog id="requestDialog" class="record-dialog" aria-labelledby="requestTitle"><div class="dialog-heading"><div><h2 id="requestTitle">Customer request</h2><p id="requestContact" class="fine-print"></p></div><button type="button" class="button" id="closeRequest">Close</button></div><div id="requestMessages" class="request-messages"></div><form id="requestForm"><label for="requestState">Status</label><select id="requestState"><option value="received">Received</option><option value="looking">Looking at this</option><option value="information">Need information</option><option value="arranged">Visit arranged</option><option value="completed">Completed</option></select><label for="requestReply">Message to the customer</label><textarea id="requestReply" maxlength="1500" rows="4" placeholder="Optional update for the customer"></textarea><p class="fine-print">Saving attempts to email the customer. This does not create or charge for an appointment.</p><div class="record-actions"><button type="submit" class="button primary" id="saveRequest">Save &amp; notify</button><button type="button" class="button" id="inviteRequest" data-requires-permission="manage_calls">Invite to book</button></div><p id="requestSaveStatus" role="status"></p><a id="requestBookingLink" hidden target="_blank" rel="noopener">Open private booking invitation</a></form></dialog></main><script src="workspace.js?v=9"></script><script src="help-request-workspace.js?v=1"></script></body></html>
