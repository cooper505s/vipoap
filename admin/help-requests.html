<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#102957"><title>Help requests | VIPOAP OS</title><link rel="stylesheet" href="../assets/fonts.css"><link rel="stylesheet" href="header.css"><style>:root{--n:#102957;--c:#f7f3ec;--l:#cbd9ea;--m:#667085}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--n);font-family:Quicksand,"Segoe UI",sans-serif}.shell{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:17px;margin-bottom:14px}.top,.filters{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.top img{width:52px}.filters input,.filters select,select,textarea{padding:10px;border:1px solid #aebed0;border-radius:9px;font:inherit}.filters input{min-width:240px}.request{display:grid;grid-template-columns:180px 1fr auto;gap:14px;align-items:start}.request h2{font-size:1.05rem;margin:0}.message{border-left:3px solid #90a8c8;padding:5px 10px;margin:8px 0}.muted{color:var(--m)}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eaf1fb;font-size:.78rem;font-weight:800}.btn{border:0;border-radius:9px;padding:10px 12px;background:var(--n);color:#fff;font:inherit;font-weight:800;cursor:pointer}.editor{grid-column:2/-1;display:grid;grid-template-columns:180px 1fr auto;gap:8px}.editor textarea{min-height:44px;resize:vertical}.hidden{display:none}@media(max-width:760px){.request,.editor{grid-template-columns:1fr}.editor{grid-column:1}.filters>*{width:100%}}</style></head><body><main class="shell"><header class="top card"><div class="os-brand"><img src="../assets/vipoap-os-heart-blue.png" alt=""><div><h1>Help requests</h1><p class="muted">One calm queue for customer questions</p></div></div><a class="btn" href="os">Overview</a></header><section class="card filters"><input id="search" type="search" placeholder="Search name or reference"><select id="filter"><option value="">All statuses</option><option value="received">Received</option><option value="looking">Looking at this</option><option value="information">Need information</option><option value="arranged">Visit arranged</option><option value="completed">Completed</option></select><span id="count" class="muted"></span></section><section id="requests"><div class="card muted">Loading…</div></section></main><script>let password=sessionStorage.getItem('vipoapAdmin')||'',session=sessionStorage.getItem('vipoapAdminSession')||'',records=[];const $=id=>document.getElementById(id),headers=()=>({'content-type':'application/json','x-admin-password':password,'x-admin-session':session}),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])),labels={received:'Received',looking:'Looking at this',information:'Need information',arranged:'Visit arranged',completed:'Completed'};function draw(){const query=$('search').value.toLowerCase(),status=$('filter').value,list=records.filter(item=>(!status||item.status===status)&&(!query||`${item.reference} ${item.name} ${item.email} ${item.phone}`.toLowerCase().includes(query)));$('count').textContent=`${list.length} request${list.length===1?'':'s'}`;$('requests').innerHTML=list.length?list.map((item,index)=>`<article class="card request"><div><h2>${esc(item.reference)}</h2><span class="pill">${esc(labels[item.status]||item.status)}</span><p class="muted">${new Date(item.updatedAt).toLocaleString('en-GB')}</p></div><div><strong>${esc(item.name)}</strong><p>${esc(item.phone||item.email)} · prefers ${esc(item.contactPreference)}</p>${(item.messages||[]).map(message=>`<div class="message"><strong>${esc(message.author==='customer'?'Customer':'VIPOAP')}</strong>: ${esc(message.text)}</div>`).join('')}</div><button class="btn" onclick="document.getElementById('edit${index}').classList.toggle('hidden')">Update</button><div id="edit${index}" class="editor hidden"><select id="status${index}">${Object.entries(labels).map(([value,label])=>`<option value="${value}" ${item.status===value?'selected':''}>${label}</option>`).join('')}</select><textarea id="reply${index}" placeholder="Optional message to the customer"></textarea><button class="btn" onclick="update(${index},'${esc(item.key)}')">Save &amp; notify</button></div></article>`).join(''):'<div class="card muted">No help requests match these filters.</div>'}async function load(){try{const response=await fetch('/api/admin/help-requests',{headers:headers()}),data=await response.json();if(!response.ok)throw Error(data.error);records=data.requests;draw()}catch(error){$('requests').innerHTML=`<div class="card">${esc(error.message)}. Please sign in again from VIPOAP OS.</div>`}}async function update(index,key){const response=await fetch('/api/admin/help-requests',{method:'PATCH',headers:headers(),body:JSON.stringify({key,status:$(`status${index}`).value,message:$(`reply${index}`).value})}),data=await response.json();if(!response.ok)return alert(data.error);await load()}$('search').oninput=draw;$('filter').onchange=draw;load();</script><script src="email-login.js"></script><script src="mobile-nav.js"></script></body></html>
