<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>VIPOAP HQ</title><style>:root{--g:#5A8F5A;--n:#102957;--c:#F7F3EC;--l:#dfe7dd;--m:#667085}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Segoe UI",sans-serif;background:var(--c);color:var(--n)}button,input,select,textarea{font:inherit}.shell{max-width:1180px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.top img{width:180px}.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:22px;margin-bottom:20px}.login{max-width:460px;margin:8vh auto}.field{margin:14px 0}label{display:block;font-weight:800;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #bdcbb9;border-radius:12px}textarea{min-height:86px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#fff;color:var(--g);border:2px solid var(--g)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat strong{display:block;font-size:2rem}.muted{color:var(--m)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab[aria-pressed=true]{background:var(--g);color:#fff}.booking{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;border-top:1px solid var(--l);padding:18px 0}.booking:first-child{border-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.availability{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.hidden{display:none!important}.status{min-height:24px;margin-top:10px}@media(max-width:850px){.grid,.availability{grid-template-columns:1fr 1fr}.booking{grid-template-columns:1fr}}@media(max-width:560px){.grid,.availability{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="shell"><section id="login" class="card login"><img src="../assets/logo-primary.png" alt="VIPOAP" style="width:190px"><h1>VIPOAP HQ</h1><p class="muted">Enter the admin password configured in Cloudflare.</p><div class="field"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" id="loginBtn">Sign in</button><p id="loginStatus" class="status" aria-live="polite"></p></section><section id="hq" class="hidden"><header class="top"><div><img src="../assets/logo-primary.png" alt="VIPOAP"><h1>HQ Dashboard</h1></div><button class="btn secondary" id="logoutBtn">Sign out</button></header><div class="grid"><article class="card stat"><span>Upcoming</span><strong id="upcomingCount">0</strong></article><article class="card stat"><span>Pending</span><strong id="pendingCount">0</strong></article><article class="card stat"><span>Confirmed</span><strong id="confirmedCount">0</strong></article><article class="card stat"><span>Completed</span><strong id="completedCount">0</strong></article></div><section class="card"><div class="tabs"><button class="btn tab" data-filter="all" aria-pressed="true">All</button><button class="btn tab" data-filter="pending" aria-pressed="false">Pending</button><button class="btn tab" data-filter="confirmed" aria-pressed="false">Confirmed</button><button class="btn tab" data-filter="completed" aria-pressed="false">Completed</button></div><h2>Bookings</h2><div id="bookings"></div><p id="bookingStatus" class="status" aria-live="polite"></p></section><section class="card"><h2>Availability</h2><p class="muted">Set weekly hours and block whole dates for holidays or other commitments.</p><div class="availability"><div class="field"><label>Monday</label><input id="monday" value="19:00-21:00"></div><div class="field"><label>Wednesday</label><input id="wednesday" value="19:00-21:00"></div><div class="field"><label>Saturday</label><input id="saturday" value="11:00-13:00, 16:00-19:00"></div></div><div class="field"><label for="blocked">Blocked dates, one per line (YYYY-MM-DD)</label><textarea id="blocked"></textarea></div><button class="btn primary" id="saveAvailability">Save availability</button><p id="availabilityStatus" class="status" aria-live="polite"></p></section></section></main><script>let adminPassword=sessionStorage.getItem('vipoapAdmin')||'',allBookings=[],activeFilter='all';const $=id=>document.getElementById(id);const headers=()=>({'content-type':'application/json','x-admin-password':adminPassword});function ranges(value){return value.split(',').map(x=>x.trim()).filter(Boolean).map(x=>x.split('-').map(y=>y.trim())).filter(x=>x.length===2)}function showHQ(){login.classList.add('hidden');hq.classList.remove('hidden')}async function api(url,options={}){const r=await fetch(url,{...options,headers:{...headers(),...(options.headers||{})}});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');return data}async function signIn(){adminPassword=password.value;loginStatus.textContent='Signing in…';try{await loadAll();sessionStorage.setItem('vipoapAdmin',adminPassword);showHQ();loginStatus.textContent=''}catch(e){loginStatus.textContent=e.message}}async function loadAll(){const [b,a]=await Promise.all([api('/api/admin/bookings'),api('/api/admin/availability')]);allBookings=b.bookings||[];render();monday.value=(a.weekly?.monday||[]).map(x=>x.join('-')).join(', ');wednesday.value=(a.weekly?.wednesday||[]).map(x=>x.join('-')).join(', ');saturday.value=(a.weekly?.saturday||[]).map(x=>x.join('-')).join(', ');blocked.value=(a.blockedDates||[]).join('\n')}function render(){const today=new Date().toISOString().slice(0,10);upcomingCount.textContent=allBookings.filter(x=>x.date>=today&&!['cancelled','declined','completed'].includes(x.status||'pending')).length;pendingCount.textContent=allBookings.filter(x=>(x.status||'pending')==='pending').length;confirmedCount.textContent=allBookings.filter(x=>x.status==='confirmed').length;completedCount.textContent=allBookings.filter(x=>x.status==='completed').length;const list=activeFilter==='all'?allBookings:allBookings.filter(x=>(x.status||'pending')===activeFilter);bookings.innerHTML=list.length?list.map(b=>`<article class="booking"><div><h3>${b.name||'Customer'} — ${b.reference}</h3><p><strong>${b.date} at ${b.time}</strong> (${b.duration} minutes)</p><p>${b.service}<br>${b.phone}${b.email?` · ${b.email}`:''}<br>${b.postcode}</p><p class="muted">${b.details||'No additional details'}</p></div><div><div class="field"><label>Status</label><select data-status="${b.key}">${['pending','confirmed','declined','completed','cancelled'].map(s=>`<option ${s===(b.status||'pending')?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Admin notes</label><textarea data-notes="${b.key}">${b.adminNotes||''}</textarea></div><button class="btn primary" data-save="${b.key}">Save</button></div></article>`).join(''):'<p class="muted">No bookings in this view.</p>'}async function saveBooking(key){bookingStatus.textContent='Saving…';const status=document.querySelector(`[data-status="${CSS.escape(key)}"]`).value;const adminNotes=document.querySelector(`[data-notes="${CSS.escape(key)}"]`).value;try{await api('/api/admin/bookings',{method:'PATCH',body:JSON.stringify({key,status,adminNotes})});await loadAll();bookingStatus.textContent='Booking updated.'}catch(e){bookingStatus.textContent=e.message}}loginBtn.onclick=signIn;password.addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});logoutBtn.onclick=()=>{sessionStorage.removeItem('vipoapAdmin');location.reload()};document.addEventListener('click',e=>{if(e.target.dataset.save)saveBooking(e.target.dataset.save);if(e.target.dataset.filter){activeFilter=e.target.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===e.target));render()}});saveAvailability.onclick=async()=>{availabilityStatus.textContent='Saving…';const data={weekly:{monday:ranges(monday.value),wednesday:ranges(wednesday.value),saturday:ranges(saturday.value)},blockedDates:blocked.value.split(/\s+/).map(x=>x.trim()).filter(Boolean)};try{await api('/api/admin/availability',{method:'POST',body:JSON.stringify(data)});availabilityStatus.textContent='Availability saved.'}catch(e){availabilityStatus.textContent=e.message}};(async()=>{if(adminPassword)try{await loadAll();showHQ()}catch{sessionStorage.removeItem('vipoapAdmin')}})();</script></body></html>
