<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#102957"><title>Home Health Check | VIPOAP OS</title><link rel="stylesheet" href="../assets/fonts.css"><link rel="stylesheet" href="header.css?v=4"><style>:root{--n:#102957;--c:#f7f3ec;--l:#cbd9ea;--m:#667085}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--n);font-family:Quicksand,"Segoe UI",sans-serif}.shell{max-width:1050px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;margin-bottom:14px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top img{width:55px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:12px 0}label{font-weight:800;display:block;margin-bottom:6px}select,textarea{width:100%;padding:11px;border:1px solid #aebed0;border-radius:9px;font:inherit}textarea{min-height:90px}.btn{border:0;border-radius:9px;padding:10px 13px;background:var(--n);color:#fff;font:inherit;font-weight:800;cursor:pointer}.score{font-size:2rem;font-weight:800}.muted{color:var(--m)}.item{border-top:1px solid var(--l);padding:12px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><header class="top card os-page-header"><a class="os-brand" href="os" aria-label="VIPOAP OS overview"><img src="../assets/vipoap-os-heart-blue.png" alt=""><div><h1>VIPOAP OS</h1><p class="muted">Administration portal</p></div></a><span class="os-portal-badge">Secure admin</span></header><section class="os-page-heading"><div><h2>Home Health Check</h2><p class="muted">A clear, explainable household technology score</p></div><div class="actions"><a class="btn secondary" href="customers">Customers</a></div></section><section class="card"><label for="customer">Customer</label><select id="customer"></select></section><section class="card"><h2>Assessment</h2><p>Choose the statement that best reflects what you checked. VIPOAP calculates the overall score.</p><div id="areas" class="grid"></div><div class="field"><label for="observations">Customer-safe observations</label><textarea id="observations" placeholder="What was checked and what the household should remember."></textarea></div><div class="field"><label for="recommendations">Additional recommendation (optional)</label><textarea id="recommendations"></textarea></div><button id="save" class="btn">Complete health check</button><p id="status" aria-live="polite"></p></section><section class="card"><h2>Previous checks</h2><div id="history" class="muted">Choose a customer.</div></section></main><script>let password=sessionStorage.getItem('vipoapAdmin')||'',session=sessionStorage.getItem('vipoapAdminSession')||'',customers=[];const $=id=>document.getElementById(id),headers=()=>({'content-type':'application/json','x-admin-password':password,'x-admin-session':session}),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])),areas={wifi:'Wi-Fi coverage and reliability',security:'Account and device security',backup:'Photos and important-file backups',device:'Device condition and support',scamAwareness:'Scam awareness and safe checking'};$('areas').innerHTML=Object.entries(areas).map(([id,label])=>`<div class="field"><label for="${id}">${label}</label><select id="${id}"><option value="">Choose an assessment</option><option value="good">Working well</option><option value="attention">Needs some attention</option><option value="urgent">Needs prompt action</option></select></div>`).join('');async function api(url,options={}){const response=await fetch(url,{...options,headers:{...headers(),...options.headers}}),data=await response.json();if(!response.ok)throw Error(data.error);return data}async function load(){const data=await api('/api/admin/customers');customers=data.customers;$('customer').innerHTML=customers.map(item=>`<option value="${esc(item.key)}">${esc(item.name)} · ${esc(item.postcode)}</option>`).join('');await history()}async function history(){if(!$('customer').value)return;const data=await api(`/api/admin/health-checks?customerId=${encodeURIComponent($('customer').value)}`);$('history').innerHTML=data.checks.length?data.checks.map(item=>`<article class="item"><div class="row"><strong>${new Date(item.completedAt).toLocaleDateString('en-GB')}</strong><span class="score">${item.overallScore}/100</span></div><p>${item.recommendations.map(esc).join(' ')||'No improvements recorded.'}</p><p class="muted">Next review ${esc(item.nextReviewDue)}</p></article>`).join(''):'<p>No previous health checks.</p>'}$('customer').onchange=history;$('save').onclick=async()=>{const answers=Object.fromEntries(Object.keys(areas).map(id=>[id,$(id).value]));$('status').textContent='Calculating and saving…';try{const data=await api('/api/admin/health-checks',{method:'POST',body:JSON.stringify({customerId:$('customer').value,answers,observations:$('observations').value,recommendations:$('recommendations').value})});$('status').textContent=`Health check saved. Overall score: ${data.check.overallScore}/100.`;await history()}catch(error){$('status').textContent=error.message}};load().catch(error=>$('status').textContent=error.message);</script><script src="email-login.js"></script><script src="mobile-nav.js"></script></body></html>
