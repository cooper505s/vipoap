div><h1>VIPOAP OS</h1><p class="muted">Administration portal</p></div></a><div class="os-header-controls"><span class="os-portal-badge">Secure admin</span><span class="os-install-slot" aria-live="polite"></span></div></header><section class="os-page-heading"><div><h2>Engineer Community Knowledge Hub</h2><p class="muted">Engineer community guidance and shared answers</p></div><div class="actions"><a class="btn secondary" href="training">Training</a><a class="btn secondary" href="os">Overview</a><button class="btn" id="logoutBtn">Sign out</button></div></section><section class="card"><div class="grid"><input id="search" placeholder="Search practical answers"><select id="category"><option value="">All categories</option></select></div><div id="articles"></div></section><section class="card"><h2>Share a useful solution</h2><p class="muted">Never include customer names, addresses, contact details, passwords or private records.</p><div class="grid"><div><label for="title">Title</label><input id="title"></div><div><label for="newCategory">Category</label><select id="newCategory"></select></div></div><label for="summary">Short summary</label><input id="summary"><label for="content">Safe step-by-step guidance</label><textarea id="content"></textarea><button class="btn" id="submitArticle">Submit article</button><p id="status"></p></section></section></main><script src="knowledge.js"></script><script src="email-login.js"></script><script src="mobile-nav.js"></script></body></html>
