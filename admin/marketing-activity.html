<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Activity & requests | VIPOAP OS</title><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="/assets/vipoap-os-icon-192.png"><link rel="stylesheet" href="workspace.css?v=7"></head><body data-workspace="engineer" data-page-permission="manage_marketing"><main class="workspace-main" id="main-content"><header class="page-heading"><div><span class="eyebrow">Marketing</span><h1>Activity & requests</h1><p>Plan, manage and review your marketing work.</p></div></header><section class="panel"><div class="panel-heading"><h2>Marketing activity</h2><button type="button" class="button primary" id="logMarketing">Log activity</button></div><div id="marketingActivity" class="panel-body"><p>Loading your activity…</p></div></section><dialog class="record-dialog" id="marketingLogDialog"><button class="button dialog-dismiss" type="button" id="closeMarketingLog">Close</button><section class="card wide"><h2>Log local marketing</h2><div class="marketing-grid"><div class="field"><label for="type">Activity</label><select id="type"><option value="leaflets">Leaflets or posters</option><option value="social">Social or community post</option><option value="organisation">Organisation outreach</option><option value="print-request">Request printed materials</option><option value="event-request">Request Tech Help event approval</option></select></div><div class="field"><label for="location">Location or organisation</label><input id="location"></div><div class="field"><label for="campaign">Campaign or referral code</label><input id="campaign"></div><div class="field"><label for="quantity">Quantity</label><input id="quantity" type="number" min="0"></div><div class="field wide"><label for="notes">Notes</label><textarea id="notes"></textarea></div></div><button class="btn primary" id="save">Save activity</button><p id="status" aria-live="polite"></p></section>
