<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#102957"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VIPOAP OS"><title>Training | VIPOAP OS</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../assets/vipoap-os-icon-192.png?v=4"><link rel="stylesheet" href="../assets/fonts.css"><link rel="stylesheet" href="header.css?v=5"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ec;color:#102957;font-family:Quicksand,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.shell{max-width:1180px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #cbd9ea;border-radius:18px;padding:20px;margin-bottom:18px}.login{max-width:440px;margin:8vh auto}.top,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.course{border-top:1px solid #cbd9ea;padding:16px 0}.field{margin:10px 0}label{display:block;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #9fb4cf;border-radius:11px;color:#102957;background:#fff}.btn{display:inline-block;border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:#102957;color:#fff}.secondary{background:#fff;color:#102957;border:2px solid #102957}.quiet,.pill{background:#eaf1fb;color:#102957}.pill{display:inline-block;padding:4px 9px;border-radius:99px;font-size:.82rem}.muted{color:#667085}.hidden{display:none!important}@media(max-width:720px){.grid{grid-template-columns:1fr}.top,.row{align-items:flex-start;flex-direction:column}.shell{padding:10px}}
</style></head><body data-page-permission="view_training" data-workspace="partner"><main class="shell"><section id="login" class="card login"><img src="../assets/vipoap-os-heart-blue.png" alt="VIPOAP" width="110"><h1>VIPOAP OS Training</h1><input id="password" type="password" placeholder="Admin password"><button class="btn primary" id="loginBtn">Sign in</button><p id="loginStatus"></p></section><section id="app" class="hidden"><header class="top card os-page-header"><a class="os-brand" href="/admin/" aria-label="VIPOAP OS home"><img src="../assets/vipoap-os-heart-blue.png" alt=""><div><h1>VIPOAP OS</h1><p class="muted">Administration portal</p></div></a><div class="os-header-controls"><span class="os-portal-badge">Secure workspace</span><span class="os-install-slot" aria-live="polite"></span></div></header><section class="os-page-heading"><div><h2>Training and standards</h2><p class="muted">Learning, assessments and operating standards</p></div><div class="actions"><a class="btn secondary" href="/admin/">My work</a><a class="btn secondary" data-requires-permission="view_franchise" href="franchise">Admin centre</a><button class="btn quiet" id="logoutBtn">Sign out</button></div></section><section class="card"><div class="row"><div><h2>Learning plan</h2><p class="muted">Required technical, customer-care, safety and franchise standards.</p></div><select id="operatorSelect" style="max-width:320px"></select></div><div id="summary"></div><div id="courses"></div></section><section class="card" data-requires-permission="manage_training"><h2>Create a course</h2><div class="grid"><div class="field"><label for="courseTitle">Course title</label><input id="courseTitle"></div><div class="field"><label for="courseCategory">Category</label><input id="courseCategory"></div><div class="field"><label for="courseRequired">Requirement</label><select id="courseRequired"><option value="true">Required</option><option value="false">Optional</option></select></div><div class="field" style="grid-column:1/-1"><label for="courseSummary">Summary</label><textarea id="courseSummary"></textarea></div><div class="field" style="grid-column:1/-1"><label for="courseLessons">Lessons (one per line)</label><textarea id="courseLessons"></textarea></div></div><button class="btn primary" id="saveCourse">Save course</button><p id="courseStatus"></p></section></section></main><script>
let password=sessionStorage.getItem('vipoapAdmin')||'',session=sessionStorage.getItem('vipoapAdminSession')||'',operators=[],courses=[],progress=[];const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),headers=()=>({'content-type':'application/json','x-admin-password':password,'x-admin-session':session});async function api(url,options={}){const response=await fetch(url,{...options,headers:{...headers(),...options.headers}}),data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}async function load(){const o=await api('/api/admin/operators');operators=o.operators||[];$('operatorSelect').innerHTML=operators.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} · ${esc((x.territoryIds||[]).join(', '))}</option>`).join('');await loadCourses()}async function loadCourses(){const data=await api(`/api/admin/training?operatorId=${encodeURIComponent($('operatorSelect').value||operators[0]?.id||'')}`);courses=data.courses||[];progress=data.progress||[];render()}function render(){const done=progress.filter(x=>x.status==='complete').length;$('summary').innerHTML=`<p><strong>${done} of ${courses.length} complete</strong> · ${courses.length?Math.round(done/courses.length*100):0}%</p>`;$('courses').innerHTML=courses.map(c=>{const p=progress.find(x=>x.courseId===c.id)||{};return`<article class="course"><div class="row"><div><span class="pill">${esc(c.category)}</span><h3>${esc(c.title)}</h3><p>${esc(c.summary)}</p><ol>${(c.lessons||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div style="min-width:240px"><label>Status</label><select data-status="${esc(c.id)}"><option value="not-started">Not started</option><option value="in-progress">In progress</option><option value="complete">Complete</option><option value="expired">Expired</option></select><label>Score %</label><input data-score="${esc(c.id)}" type="number" min="0" max="100" value="${Number(p.score||0)}"><label>Notes / evidence</label><textarea data-notes="${esc(c.id)}">${esc(p.notes||'')}</textarea><button class="btn primary" data-save="${esc(c.id)}">Save progress</button></div></div></article>`}).join('');for(const p of progress){const select=document.querySelector(`[data-status="${CSS.escape(p.courseId)}"]`);if(select)select.value=p.status}document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveProgress(b.dataset.save))}async function saveProgress(courseId){await api('/api/admin/training',{method:'PATCH',body:JSON.stringify({operatorId:$('operatorSelect').value,courseId,status:document.querySelector(`[data-status="${CSS.escape(courseId)}"]`).value,score:Number(document.querySelector(`[data-score="${CSS.escape(courseId)}"]`).value),notes:document.querySelector(`[data-notes="${CSS.escape(courseId)}"]`).value})});await loadCourses()}async function saveCourse(){try{await api('/api/admin/training',{method:'POST',body:JSON.stringify({title:$('courseTitle').value,category:$('courseCategory').value,required:$('courseRequired').value==='true',summary:$('courseSummary').value,lessons:$('courseLessons').value.split('\n').filter(Boolean)})});$('courseStatus').textContent='Course saved.';await loadCourses()}catch(e){$('courseStatus').textContent=e.message}}async function signIn(){password=$('password').value;try{await load();sessionStorage.setItem('vipoapAdmin',password);$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){$('loginStatus').textContent=e.message}}$('loginBtn').onclick=signIn;$('operatorSelect').onchange=loadCourses;$('saveCourse').onclick=saveCourse;$('logoutBtn').onclick=()=>{sessionStorage.clear();location.reload()};(async()=>{if(password||session)try{await load();$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch{sessionStorage.clear()}})();
</script><script src="training-assessments.js"></script><script src="email-login.js?v=5"></script><script src="mobile-nav.js"></script></body></html>
