<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#102957"><title>Franchise Control | VIPOAP OS</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="../assets/fonts.css"><link rel="stylesheet" href="header.css?v=4"><style>
:root{--g:#5A8F5A;--n:#102957;--c:#F7F3EC;--p:#edf5ea;--l:#dfe7dd;--m:#667085}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--n);font-family:Quicksand,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.shell{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;margin-bottom:18px}.login{max-width:440px;margin:8vh auto}.top,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.top img{width:75px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric strong{display:block;font-size:1.7rem;color:var(--g)}.field{margin:10px 0}.wide{grid-column:1/-1}label{display:block;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #bdcbb9;border-radius:11px;color:var(--n);background:#fff}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--g);color:#fff}.secondary{background:#fff;color:var(--g);border:2px solid var(--g)}.quiet,.pill{background:var(--p);color:var(--n)}.muted{color:var(--m)}.hidden{display:none!important}.item{border-top:1px solid var(--l);padding:14px 0}.pill{display:inline-block;padding:4px 9px;border-radius:99px;font-size:.82rem;font-weight:800}@media(max-width:760px){.grid,.metrics{grid-template-columns:1fr 1fr}.top,.row{align-items:flex-start;flex-direction:column}.shell{padding:10px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VIPOAP OS"></head><body><main class="shell"><section id="login" class="card login"><img src="../assets/vipoap-os-heart-blue.png" alt="VIPOAP" width="110"><h1>Franchise control</h1><div class="field"><label for="password">Admin password</label><input id="password" type="password"></div><button class="btn primary" id="loginBtn">Sign in</button><p id="loginStatus"></p></section><section id="app" class="hidden"><header class="top card os-page-header"><a class="os-brand" href="os" aria-label="VIPOAP OS overview"><img src="../assets/vipoap-os-heart-blue.png" alt=""><div><h1>VIPOAP OS</h1><p class="muted">Administration portal</p></div></a><div class="os-header-controls"><span class="os-portal-badge">Secure admin</span><span class="os-install-slot" aria-live="polite"></span></div></header><section class="os-page-heading"><div><h2>Franchise control</h2><p class="muted">Manage territories, partners and network operations</p></div><div class="actions"><a class="btn secondary" href="os">Overview</a><a class="btn secondary" href="training">Training</a><button class="btn quiet" id="logoutBtn">Sign out</button></div></section><section class="card"><div class="row"><h2>Network report</h2><select id="reportTerritory" style="max-width:300px"><option value="">All authorised territories</option></select></div><div id="metrics" class="metrics"></div><div id="territoryPerformance"></div><h3>Recent completed calls</h3><div id="completedVisits"></div></section><section class="card"><h2>Territories</h2><div id="territories"></div><h3>Add territory</h3><div class="grid"><div class="field"><label for="territoryName">Name</label><input id="territoryName" placeholder="Basingstoke"></div><div class="field"><label for="territoryCode">Code</label><input id="territoryCode" placeholder="BAS"></div><div class="field"><label for="territoryStatus">Status</label><select id="territoryStatus"><option value="planning">Planning</option><option value="onboarding">Onboarding</option><option value="active">Active</option></select></div><div class="field"><label for="postcodePrefixes">Postcode prefixes</label><input id="postcodePrefixes" placeholder="RG21, RG22, RG23, RG24"></div><div class="field"><label for="franchiseeName">Franchisee</label><input id="franchiseeName"></div><div class="field"><label for="territoryEmail">Contact email</label><input id="territoryEmail" type="email"></div><div class="field"><label for="royaltyRate">Royalty %</label><input id="royaltyRate" type="number" min="0" max="100" step="0.1"></div><div class="field"><label for="brandFundRate">Brand fund %</label><input id="brandFundRate" type="number" min="0" max="100" step="0.1"></div></div><button class="btn primary" id="saveTerritory">Create territory</button><p id="territoryStatusMessage"></p></section><section class="card"><h2>Operators and roles</h2><div id="operators"></div><h3>Add operator</h3><div class="grid"><div class="field"><label for="operatorName">Name</label><input id="operatorName"></div><div class="field"><label for="operatorEmail">Email</label><input id="operatorEmail" type="email"></div><div class="field"><label for="operatorPhone">Phone</label><input id="operatorPhone"></div><div class="field"><label for="operatorRole">Role</label><select id="operatorRole"><option value="operator">Operator</option><option value="viewer">Viewer</option><option value="admin">Administrator</option></select></div><div class="field"><label for="operatorTerritory">Territory</label><select id="operatorTerritory"></select></div><div class="field"><label for="trainingStatus">Training</label><select id="trainingStatus"><option value="not-started">Not started</option><option value="in-progress">In progress</option><option value="complete">Complete</option></select></div><div class="field"><label for="dbsStatus">DBS status</label><select id="dbsStatus"><option value="not-recorded">Not recorded</option><option value="required">Required</option><option value="in-progress">In progress</option><option value="verified">Verified</option></select></div><div class="field"><label for="agreementStatus">Agreement</label><select id="agreementStatus"><option value="not-issued">Not issued</option><option value="issued">Issued</option><option value="signed">Signed</option></select></div></div><button class="btn primary" id="saveOperator">Create operator</button><p id="operatorStatusMessage"></p></section><section class="card"><h2>Recent control-plane changes</h2><div id="audit"></div></section></section></main><script>
let password=sessionStorage.getItem('vipoapAdmin')||'',adminSession=sessionStorage.getItem('vipoapAdminSession')||'',territories=[],operators=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),headers=()=>({'content-type':'application/json','x-admin-password':password,'x-admin-session':adminSession});async function api(url,options={}){const response=await fetch(url,{...options,headers:{...headers(),...options.headers}}),data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}async function load(){const[t,o,a]=await Promise.all([api('/api/admin/territories'),api('/api/admin/operators'),api('/api/admin/audit-log')]);territories=t.territories||[];operators=o.operators||[];$('territories').innerHTML=territories.map(x=>`<article class="item"><div class="row"><div><h3>${esc(x.name)} (${esc(x.code)})</h3><p>${esc((x.postcodePrefixes||[]).join(', '))} Â· ${esc(x.franchiseeName||'Franchisee not assigned')}</p></div><div><span class="pill">${esc(x.status)}</span><p>${Number(x.royaltyRate||0)}% royalty Â· ${Number(x.brandFundRate||0)}% brand fund</p></div></div></article>`).join('');$('operators').innerHTML=operators.map(x=>`<article class="item"><div class="row"><div><h3>${esc(x.name)}</h3><p>${esc(x.email)} Â· ${esc((x.territoryIds||[]).join(', '))}</p></div><div><span class="pill">${esc(x.role)}</span> <span class="pill">${esc(x.status)}</span><p>Training: ${esc(x.trainingStatus)} Â· DBS: ${esc(x.dbsStatus||'not recorded')}</p></div></div></article>`).join('');const options=territories.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');$('reportTerritory').innerHTML='<option value="">All authorised territories</option>'+options;$('operatorTerritory').innerHTML=options;$('audit').innerHTML=(a.events||[]).slice(0,30).map(x=>`<article class="item"><strong>${esc(x.action)} ${esc(x.entityType)}</strong><p>${esc(x.actorEmail)} Â· ${esc(x.createdAt)}</p></article>`).join('')||'<p class="muted">No changes recorded yet.</p>';await report()}async function report(){const data=await api(`/api/admin/franchise-report?territory=${encodeURIComponent($('reportTerritory').value)}`),m=data.metrics;$('metrics').innerHTML=[['Territories',m.territories],['Customers',m.customers],['Members',m.members],['Bookings',m.bookings],['Completed calls',m.completedCallouts],['Revenue',`&pound;${Number(m.revenue).toFixed(2)}`],['Outstanding',`&pound;${Number(m.outstanding).toFixed(2)}`],['Average invoice',`&pound;${Number(m.averageInvoice).toFixed(2)}`]].map(([label,value])=>`<article class="card metric"><span>${label}</span><strong>${value}</strong></article>`).join('');$('territoryPerformance').innerHTML=data.byTerritory.map(x=>`<article class="item"><strong>${esc(x.id)}</strong> Â· ${x.customers} customers Â· ${x.callouts} calls Â· &pound;${Number(x.revenue).toFixed(2)} revenue</article>`).join('');$('completedVisits').innerHTML=(data.completedVisits||[]).map(x=>`<article class="item"><div class="row"><div><strong>${esc(x.customerName||'Customer')} · ${esc(x.reference||'Completed booking')}</strong><p>${esc(x.date)} · ${esc(x.summary||'No summary recorded')}</p></div><div><span class="pill">${esc(x.kind)}</span><p class="money">${x.amount?`&pound;${Number(x.amount).toFixed(2)}`:'No charge recorded'}</p></div></div></article>`).join('')||'<p class="muted">No completed calls have been recorded for this territory yet.</p>'}async function createTerritory(){const body={name:$('territoryName').value,code:$('territoryCode').value,status:$('territoryStatus').value,postcodePrefixes:$('postcodePrefixes').value.split(',').map(x=>x.trim()).filter(Boolean),franchiseeName:$('franchiseeName').value,contactEmail:$('territoryEmail').value,royaltyRate:Number($('royaltyRate').value),brandFundRate:Number($('brandFundRate').value)};$('territoryStatusMessage').textContent='Saving...';try{await api('/api/admin/territories',{method:'POST',body:JSON.stringify(body)});await load();$('territoryStatusMessage').textContent='Territory created.'}catch(e){$('territoryStatusMessage').textContent=e.message}}async function createOperator(){const body={name:$('operatorName').value,email:$('operatorEmail').value,phone:$('operatorPhone').value,role:$('operatorRole').value,status:'invited',territoryIds:[$('operatorTerritory').value],trainingStatus:$('trainingStatus').value,dbsStatus:$('dbsStatus').value,agreementStatus:$('agreementStatus').value};$('operatorStatusMessage').textContent='Saving...';try{await api('/api/admin/operators',{method:'POST',body:JSON.stringify(body)});await load();$('operatorStatusMessage').textContent='Operator created.'}catch(e){$('operatorStatusMessage').textContent=e.message}}async function signIn(){password=$('password').value;try{await load();sessionStorage.setItem('vipoapAdmin',password);$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){$('loginStatus').textContent=e.message}}$('loginBtn').onclick=signIn;$('password').onkeydown=e=>{if(e.key==='Enter')signIn()};$('logoutBtn').onclick=()=>{sessionStorage.clear();location.reload()};$('saveTerritory').onclick=createTerritory;$('saveOperator').onclick=createOperator;$('reportTerritory').onchange=report;(async()=>{if(password||adminSession)try{await load();$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch{sessionStorage.clear()}})();
</script><script src="franchise-brand.js"></script><script src="franchise-tools.js"></script><script src="email-login.js"></script><script src="mobile-nav.js"></script></body></html>
