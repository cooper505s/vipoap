<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#102957"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VIPOAP OS"><title>VIPOAP OS</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../assets/vipoap-os-icon-192.png?v=4"><link rel="stylesheet" href="../assets/fonts.css"><link rel="stylesheet" href="header.css?v=5"><style>
:root{--g:#5A8F5A;--n:#102957;--c:#F7F3EC;--p:#edf5ea;--l:#dfe7dd;--m:#667085;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--n);font-family:Quicksand,"Segoe UI",sans-serif}button,input{font:inherit}.shell{max-width:1240px;margin:auto;padding:20px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;margin-bottom:18px}.login{max-width:440px;margin:8vh auto}.top,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:80px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric strong{display:block;font-size:1.8rem;color:var(--g)}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.item{border-top:1px solid var(--l);padding:13px 0}.item:first-child{border-top:0}.btn{display:inline-block;border:0;border-radius:11px;padding:11px 14px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#fff;color:var(--g);border:2px solid var(--g)}.quiet,.pill{background:var(--p);color:var(--n)}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:.8rem;font-weight:800}.muted{color:var(--m)}.danger{color:var(--red);font-weight:800}.hidden{display:none!important}input{width:100%;padding:12px;border:1px solid #bdcbb9;border-radius:11px}.field{margin:12px 0}label{display:block;font-weight:800;margin-bottom:5px}@media(max-width:850px){.metrics{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.shell{padding:10px}.card{padding:15px}.metrics{grid-template-columns:1fr 1fr}.actions{align-items:stretch;flex-direction:column}.btn{text-align:center}}
.dashboard-panel{background:linear-gradient(145deg,#fff 0%,#f3f8f1 100%);border-color:#cadbc6}.dashboard-kicker{margin:0;color:var(--g);font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.dashboard-panel h2{margin:.2rem 0}.pulse-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.pulse-card{min-height:118px;padding:15px;border:1px solid var(--l);border-radius:15px;background:#fff;color:var(--n);text-decoration:none;display:flex;flex-direction:column}.pulse-card strong{font-size:1.75rem;color:var(--g);margin:auto 0}.pulse-card small{font-weight:800;color:var(--g)}.pulse-card.alert{border-color:#f0b8b2;background:#fff7f6}.pulse-card.alert strong{color:var(--red)}.pulse-card.warn{border-color:#ead69a;background:#fffbed}.pulse-card.good{border-color:#bcd8b7}.quick-actions{display:flex;gap:8px;flex-wrap:wrap}.quick-actions a{background:var(--n);color:#fff;border-radius:99px;padding:8px 12px;text-decoration:none;font-weight:800;font-size:.86rem}.health-heading{margin:24px 0 10px}.metric-link{color:inherit;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease}.metric-link:hover,.metric-link:focus-visible{transform:translateY(-2px);box-shadow:0 10px 28px #10295718}.metric-link small{display:block;margin-top:8px;color:var(--g);font-weight:800}@media(max-width:1000px){.pulse-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.pulse-grid{grid-template-columns:1fr 1fr}}</style></head><body data-page-permission="manage_operations" data-workspace="admin"><main class="shell"><section id="login" class="card login"><img src="../assets/vipoap-os-heart-blue.png" alt="VIPOAP" width="110"><h1>VIPOAP OS</h1><p class="muted">Secure business administration.</p><div class="field"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" id="loginBtn">Sign in</button><p id="loginStatus"></p></section><section id="os" class="hidden"><header class="top card os-page-header"><a class="os-brand" href="/admin/" aria-label="VIPOAP OS home"><img src="../assets/vipoap-os-heart-blue.png" alt=""><div><h1>VIPOAP OS</h1><p class="muted">Administration portal</p></div></a><div class="os-header-controls"><span class="os-portal-badge">Secure workspace</span><span class="os-install-slot" aria-live="polite"></span></div></header><section class="os-page-heading"><div><h2>Admin overview</h2><p class="muted">Central operations, exceptions, platform health and controls</p></div><div class="actions"><a class="btn secondary" href="./">Visits</a><a class="btn secondary" href="customers">Customers</a><a class="btn secondary" href="billing">Billing</a><a class="btn secondary" href="franchise">Network</a><a class="btn secondary" href="training">Training</a><button class="btn quiet" id="logoutBtn">Sign out</button></div></section><section class="metrics" id="metrics"></section><div class="layout"><section class="card" id="today-jobs"><h2>Today's visits</h2><div id="today"></div></section><section class="card" id="follow-up-work"><h2>Follow-up work queue</h2><div id="followups"></div></section><section class="card"><h2>Upgrade opportunities</h2><div id="upgrades"></div></section><section class="card"><h2>Recent activity</h2><div id="activity"></div></section></div></section></main><script>
let adminPassword=sessionStorage.getItem('vipoapAdmin')||'',adminSession=sessionStorage.getItem('vipoapAdminSession')||'',dashboard;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),headers=()=>({'content-type':'application/json','x-admin-password':adminPassword,'x-admin-session':adminSession});async function api(url,options={}){const response=await fetch(url,{...options,headers:{...headers(),...options.headers}}),data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}const empty=text=>`<p class="muted">${text}</p>`;function render(){const m=dashboard.metrics;$('metrics').innerHTML=[['Customers',m.customers,'customers'],['Members',m.members,'customers'],['Pending bookings',m.pendingBookings,'./'],['Open follow-ups',m.openFollowUps,'#follow-up-work'],['Month revenue',`&pound;${Number(m.monthRevenue).toFixed(2)}`,'billing'],['Awaiting payment',`&pound;${Number(m.unpaidTotal).toFixed(2)}`,'billing'],['Overdue jobs',m.overdueJobs,'./'],['Overdue follow-ups',m.overdueFollowUps,'#follow-up-work']].map(([name,value,href])=>`<a class="card metric metric-link" href="${href}"><span>${name}</span><strong>${value}</strong><small>View details →</small></a>`).join('');$('today').innerHTML=dashboard.todayBookings.length?dashboard.todayBookings.map(x=>`<article class="item"><h3>${esc(x.time)} - ${esc(x.name)}</h3><p>${esc(x.service)} · ${esc(x.duration)} minutes</p><p><a href="tel:${esc(x.phone)}">${esc(x.phone)}</a> · ${esc(x.postcode)}</p><span class="pill">${esc(x.status)}</span></article>`).join(''):empty('No visits booked today.');const now=new Date().toISOString().slice(0,10);$('followups').innerHTML=dashboard.followUps.length?dashboard.followUps.map(x=>`<article class="item"><div class="row"><h3>${esc(x.customerName)}</h3>${x.followUpDate&&x.followUpDate<now?'<span class="danger">Overdue</span>':''}</div><p><strong>${esc(x.followUpDate||'No date set')}</strong> · ${esc(x.reference)}</p><p>${esc(x.followUpNotes||x.recommendations||'Follow-up required')}</p><button class="btn primary" data-complete="${esc(x.key)}">Mark complete</button></article>`).join(''):empty('No open follow-ups.');$('upgrades').innerHTML=dashboard.upgrades.length?dashboard.upgrades.map(x=>`<article class="item"><h3>${esc(x.customerName)} · ${esc(x.type)}</h3><p>${esc([x.brand,x.model,x.location].filter(Boolean).join(' · '))}</p><p>${esc(x.upgradeRecommendation||'Upgrade opportunity noted')}</p><span class="pill">${esc(x.upgradePriority)}</span></article>`).join(''):empty('No upgrades currently recorded.');$('activity').innerHTML=dashboard.activity.map(x=>`<article class="item"><div class="row"><strong>${esc(x.customerName)}</strong><span>${esc(x.date)}</span></div><p>${esc(x.kind)} · ${esc(x.reference)} · ${esc(x.status)}</p><p class="muted">${esc(x.summary)}</p></article>`).join('')||empty('No activity recorded.')}async function load(){dashboard=await api('/api/admin/dashboard');render()}async function signIn(){adminPassword=$('password').value;$('loginStatus').textContent='Signing in...';try{await load();sessionStorage.setItem('vipoapAdmin',adminPassword);$('login').classList.add('hidden');$('os').classList.remove('hidden')}catch(e){$('loginStatus').textContent=e.message}}$('loginBtn').onclick=signIn;$('password').onkeydown=e=>{if(e.key==='Enter')signIn()};$('logoutBtn').onclick=()=>{sessionStorage.removeItem('vipoapAdmin');sessionStorage.removeItem('vipoapAdminSession');location.reload()};document.addEventListener('click',async e=>{if(!e.target.dataset.complete)return;const item=dashboard.followUps.find(x=>x.key===e.target.dataset.complete);if(!item)return;e.target.disabled=true;try{await api('/api/admin/callouts',{method:'PATCH',body:JSON.stringify({...item,followUpCompleted:true,followUpCompletedAt:new Date().toISOString()})});await load()}catch(error){alert(error.message);e.target.disabled=false}});(async()=>{if(adminPassword||adminSession)try{await load();$('login').classList.add('hidden');$('os').classList.remove('hidden')}catch{sessionStorage.removeItem('vipoapAdmin');sessionStorage.removeItem('vipoapAdminSession')}})();
</script><script src="email-login.js?v=6"></script><script src="operational-health.js?v=2"></script><script src="launch-readiness.js"></script><script src="backup-controls.js"></script><script src="restore-controls.js"></script><script src="maintenance-controls.js"></script><script src="distribution-alerts.js"></script><script src="manual-assignment.js"></script><script src="reviews.js"></script><script src="ticket-workspace.js?v=2"></script><script src="control-overview.js?v=1"></script><script src="mobile-nav.js?v=3"></script></body></html>
