<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#102957"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VIPOAP OS"><title>Billing | VIPOAP OS</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../assets/vipoap-os-icon-192.png?v=4"><link rel="stylesheet" href="../assets/fonts.css"><link rel="stylesheet" href="header.css?v=2"><style>
:root{--g:#5A8F5A;--n:#102957;--c:#F7F3EC;--p:#edf5ea;--l:#dfe7dd;--m:#667085}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--n);font-family:Quicksand,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.shell{max-width:1180px;margin:auto;padding:20px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;margin-bottom:18px}.login{max-width:440px;margin:8vh auto}.top,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.top img{width:75px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.wide{grid-column:1/-1}.field{margin:10px 0}label{display:block;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #bdcbb9;border-radius:11px;color:var(--n);background:#fff}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--g);color:#fff}.secondary{background:#fff;color:var(--g);border:2px solid var(--g)}.quiet,.pill{background:var(--p);color:var(--n)}.muted{color:var(--m)}.hidden{display:none!important}.invoice{border-top:1px solid var(--l);padding:15px 0}.pill{display:inline-block;padding:4px 9px;border-radius:99px;font-size:.82rem;font-weight:800}.money{font-size:1.25rem;font-weight:800;color:var(--g)}@media(max-width:720px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top,.row{align-items:flex-start;flex-direction:column}.shell{padding:10px}.card{padding:15px}}
</style></head><body><main class="shell"><section id="login" class="card login"><img src="../assets/vipoap-os-heart-blue.png" alt="VIPOAP" width="110"><h1>VIPOAP OS Billing</h1><div class="field"><label for="password">Admin password</label><input id="password" type="password"></div><button class="btn primary" id="loginBtn">Sign in</button><p id="loginStatus"></p></section><section id="app" class="hidden"><header class="top card"><div class="os-brand"><img src="../assets/vipoap-os-heart-blue.png" alt=""><div><h1>VIPOAP OS</h1><p class="muted">Memberships &amp; billing</p></div></div><div class="actions"><a class="btn secondary" href="os">Overview</a><button class="btn quiet" id="logoutBtn">Sign out</button></div></header><section class="card"><h2>Customer membership</h2><div class="grid"><div class="field"><label for="memberCustomer">Customer</label><select id="memberCustomer"><option value="">Choose customer</option></select></div><div class="field"><label for="memberPlan">Plan</label><select id="memberPlan"><option value="none">No membership</option><option value="essential">Essential - &pound;12/month</option><option value="complete">Complete - &pound;29/month</option></select></div><div class="field"><label for="memberStatus">Status</label><select id="memberStatus"><option value="active">Active</option><option value="paused">Paused</option><option value="cancelled">Cancelled</option><option value="none">None</option></select></div><div class="field"><label for="memberStart">Start date</label><input id="memberStart" type="date"></div><div class="field"><label for="memberRenewal">Next payment / renewal</label><input id="memberRenewal" type="date"></div><div class="field"><label for="memberPrice">Monthly price</label><input id="memberPrice" type="number" min="0" step="0.01"></div><div class="field"><label for="visitsAvailable">Included visits available</label><input id="visitsAvailable" type="number" min="0" step="1"></div><div class="field"><label for="visitsUsed">Included visits used</label><input id="visitsUsed" type="number" min="0" step="1"></div></div><button class="btn primary" id="saveMembership">Save membership</button><p id="membershipStatus"></p></section><section class="card"><h2>Create invoice</h2><div class="grid"><div class="field"><label for="invoiceCustomer">Customer</label><select id="invoiceCustomer"></select></div><div class="field"><label for="invoiceCallout">Related call-out</label><select id="invoiceCallout"><option value="">No linked call-out</option></select></div><div class="field"><label for="invoiceStatus">Status</label><select id="invoiceStatus"><option value="draft">Draft</option><option value="sent">Sent</option><option value="paid">Paid</option></select></div><div class="field"><label for="issueDate">Issue date</label><input id="issueDate" type="date"></div><div class="field"><label for="dueDate">Due date</label><input id="dueDate" type="date"></div><div class="field"><label for="description">Description</label><input id="description" value="Home technology support"></div><div class="field"><label for="quantity">Quantity</label><input id="quantity" type="number" min="0.5" step="0.5" value="1"></div><div class="field"><label for="unitPrice">Unit price</label><input id="unitPrice" type="number" min="0" step="0.01" value="30"></div><div class="field wide"><label for="invoiceNotes">Notes</label><textarea id="invoiceNotes"></textarea></div></div><button class="btn primary" id="createInvoice">Create invoice</button><p id="invoiceFormStatus"></p></section><section class="card"><div class="row"><h2>Invoices</h2><div id="zoho" class="pill">Checking Zoho...</div></div><div id="invoices"></div></section></section></main><script>
let password=sessionStorage.getItem('vipoapAdmin')||'',adminSession=sessionStorage.getItem('vipoapAdminSession')||'',customers=[],callouts=[],invoices=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),headers=()=>({'content-type':'application/json','x-admin-password':password,'x-admin-session':adminSession});async function api(url,options={}){const response=await fetch(url,{...options,headers:{...headers(),...options.headers}}),data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}async function load(){const[c,o,i,z]=await Promise.all([api('/api/admin/customers'),api('/api/admin/callouts'),api('/api/admin/invoices'),api('/api/admin/zoho-status')]);customers=c.customers||[];callouts=o.callouts||[];invoices=i.invoices||[];const options='<option value="">Choose customer</option>'+customers.map(x=>`<option value="${esc(x.key)}">${esc(x.name)} - ${esc(x.phone)}</option>`).join('');$('memberCustomer').innerHTML=options;$('invoiceCustomer').innerHTML=options;$('invoiceCallout').innerHTML='<option value="">No linked call-out</option>'+callouts.map(x=>`<option value="${esc(x.key)}">${esc(x.date)} - ${esc(x.customerName)} (${esc(x.reference)})</option>`).join('');$('zoho').textContent=z.configured?`Zoho connected · ${z.pending} pending`:`Zoho ready for connection · ${z.pending} queued`;renderInvoices()}function renderInvoices(){$('invoices').innerHTML=invoices.length?invoices.map(x=>`<article class="invoice"><div class="row"><div><h3>${esc(x.number)}</h3><p>${esc(customers.find(c=>c.key===x.customerId)?.name||'Customer')} · ${esc(x.issueDate)} · due ${esc(x.dueDate)}</p><span class="pill">${esc(x.status)}</span> <span class="pill">Zoho: ${esc(x.zohoSyncStatus)}</span></div><div><p class="money">&pound;${Number(x.total).toFixed(2)}</p><div class="actions">${x.status!=='paid'?`<button class="btn primary" data-paid="${esc(x.key)}">Mark paid</button>`:''}<button class="btn secondary" data-print="${esc(x.key)}">Print</button></div></div></div></article>`).join(''):'<p class="muted">No invoices created yet.</p>'}function chooseMember(){const c=customers.find(x=>x.key===$('memberCustomer').value);if(!c)return;$('memberPlan').value=c.membershipPlan||c.membership||'none';$('memberStatus').value=c.membershipStatus||($('memberPlan').value==='none'?'none':'active');$('memberStart').value=c.membershipStartDate||'';$('memberRenewal').value=c.membershipRenewalDate||'';$('memberPrice').value=c.membershipMonthlyPrice||({essential:12,complete:29}[$('memberPlan').value]||0);$('visitsAvailable').value=c.includedVisitsAvailable||0;$('visitsUsed').value=c.includedVisitsUsed||0}async function saveMember(){const c=customers.find(x=>x.key===$('memberCustomer').value);if(!c)return $('membershipStatus').textContent='Choose a customer.';const plan=$('memberPlan').value;$('membershipStatus').textContent='Saving...';try{await api('/api/admin/customers',{method:'PATCH',body:JSON.stringify({...c,membership:plan,membershipPlan:plan,membershipStatus:$('memberStatus').value,membershipStartDate:$('memberStart').value,membershipRenewalDate:$('memberRenewal').value,membershipMonthlyPrice:Number($('memberPrice').value),includedVisitsAvailable:Number($('visitsAvailable').value),includedVisitsUsed:Number($('visitsUsed').value)})});await load();$('memberCustomer').value=c.key;chooseMember();$('membershipStatus').textContent='Membership saved.'}catch(e){$('membershipStatus').textContent=e.message}}function dates(){const today=new Date(),due=new Date();due.setDate(due.getDate()+14);$('issueDate').value=today.toISOString().slice(0,10);$('dueDate').value=due.toISOString().slice(0,10)}async function createInvoice(){const body={customerId:$('invoiceCustomer').value,calloutKey:$('invoiceCallout').value,issueDate:$('issueDate').value,dueDate:$('dueDate').value,status:$('invoiceStatus').value,notes:$('invoiceNotes').value,lines:[{description:$('description').value,quantity:Number($('quantity').value),unitPrice:Number($('unitPrice').value)}]};$('invoiceFormStatus').textContent='Creating...';try{const result=await api('/api/admin/invoices',{method:'POST',body:JSON.stringify(body)});await load();$('invoiceFormStatus').textContent=`Invoice ${result.number} created.`}catch(e){$('invoiceFormStatus').textContent=e.message}}async function updateInvoice(item,changes){await api('/api/admin/invoices',{method:'PATCH',body:JSON.stringify({...item,...changes})});await load()}function printInvoice(item){const customer=customers.find(x=>x.key===item.customerId)||{},win=open('','_blank');win.document.write(`<title>${esc(item.number)}</title><style>body{font-family:Arial;max-width:800px;margin:40px;color:#102957}header{display:flex;justify-content:space-between}table{width:100%;border-collapse:collapse;margin-top:30px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.total{text-align:right;font-size:22px}</style><header><div><h1>VIPOAP</h1><p>Technology without the worry</p></div><div><h2>Invoice ${esc(item.number)}</h2><p>Issued ${esc(item.issueDate)}<br>Due ${esc(item.dueDate)}</p></div></header><h3>Bill to</h3><p>${esc(customer.name)}<br>${esc(customer.address||'')}<br>${esc(customer.postcode||'')}</p><table><tr><th>Description</th><th>Qty</th><th>Price</th><th>Total</th></tr>${item.lines.map(line=>`<tr><td>${esc(line.description)}</td><td>${line.quantity}</td><td>&pound;${Number(line.unitPrice).toFixed(2)}</td><td>&pound;${Number(line.total).toFixed(2)}</td></tr>`).join('')}</table><p class="total"><strong>Total: &pound;${Number(item.total).toFixed(2)}</strong></p><p>${esc(item.notes||'Thank you for choosing VIPOAP.')}</p>`);win.document.close();win.print()}async function signIn(){password=$('password').value;try{await load();sessionStorage.setItem('vipoapAdmin',password);$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){$('loginStatus').textContent=e.message}}$('loginBtn').onclick=signIn;$('password').onkeydown=e=>{if(e.key==='Enter')signIn()};$('logoutBtn').onclick=()=>{sessionStorage.removeItem('vipoapAdmin');sessionStorage.removeItem('vipoapAdminSession');location.reload()};$('memberCustomer').onchange=chooseMember;$('memberPlan').onchange=()=>{$('memberPrice').value={essential:12,complete:29}[$('memberPlan').value]||0;$('memberStatus').value=$('memberPlan').value==='none'?'none':'active'};$('saveMembership').onclick=saveMember;$('createInvoice').onclick=createInvoice;$('invoiceCallout').onchange=()=>{const c=callouts.find(x=>x.key===$('invoiceCallout').value);if(c){$('invoiceCustomer').value=c.customerId||'';$('description').value=`${c.category} support - ${c.date}`;$('unitPrice').value=c.amountCharged||0}};document.addEventListener('click',e=>{const item=invoices.find(x=>x.key===(e.target.dataset.paid||e.target.dataset.print));if(e.target.dataset.paid&&item)updateInvoice(item,{status:'paid',zohoSyncStatus:'pending'});if(e.target.dataset.print&&item)printInvoice(item)});dates();(async()=>{if(password||adminSession)try{await load();$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch{sessionStorage.removeItem('vipoapAdmin');sessionStorage.removeItem('vipoapAdminSession')}})();
</script><script src="email-login.js"></script><script src="mobile-nav.js"></script></body></html>
