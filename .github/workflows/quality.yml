name: VIPOAP quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vipoap-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run complete platform suite
        run: npm test
      - name: Check PR head commit for whitespace errors
        if: github.event_name == 'pull_request'
        run: git show --check --oneline --no-renames "${{ github.event.pull_request.head.sha }}"
      - name: Check pushed commit for whitespace errors
        if: github.event_name == 'push'
        run: git show --check --oneline --no-renames HEAD
