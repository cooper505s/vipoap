<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private feedback | VIPOAP</title><link rel="stylesheet" href="assets/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ec;color:#102957;font-family:Quicksand,"Segoe UI",sans-serif}.card{max-width:620px;margin:6vh auto;background:#fff;border:1px solid #dce5da;border-radius:20px;padding:24px}.logo{width:90px}.rating{display:flex;gap:8px;margin:16px 0}.rating label{flex:1}.rating input{position:absolute;opacity:0}.rating span{display:block;text-align:center;padding:14px 6px;border:2px solid #dce5da;border-radius:12px;font-weight:800}.rating input:checked+span{background:#eef5ec;border-color:#5a8f5a;color:#5a8f5a}textarea{width:100%;min-height:120px;border:1px solid #b8c8b5;border-radius:12px;padding:12px;font:inherit}.btn{display:inline-block;border:0;border-radius:12px;background:#5a8f5a;color:#fff;padding:13px 18px;font:inherit;font-weight:800;text-decoration:none}.muted{color:#667085}.hidden{display:none}@media(max-width:640px){.card{margin:0;min-height:100vh;border-radius:0}.rating{gap:4px}}
</style></head><body><main class="card"><img class="logo" src="assets/vipoap-heart-transparent.png" alt="VIPOAP"><div id="loading">Checking your private feedback link…</div><form id="reviewForm" class="hidden"><h1>How did we do?</h1><p id="intro"></p><fieldset><legend><strong>Your overall experience</strong></legend><div class="rating"><label><input type="radio" name="rating" value="1" required><span>1<br><small>Poor</small></span></label><label><input type="radio" name="rating" value="2"><span>2</span></label><label><input type="radio" name="rating" value="3"><span>3</span></label><label><input type="radio" name="rating" value="4"><span>4</span></label><label><input type="radio" name="rating" value="5"><span>5<br><small>Excellent</small></span></label></div></fieldset><label for="comments"><strong>Anything you would like us to know?</strong></label><textarea id="comments" maxlength="1200"></textarea><label style="display:block;margin:14px 0"><input id="testimonialConsent" type="checkbox"> VIPOAP may contact me separately to ask about using these words as a testimonial</label><p class="muted">Your feedback is private. Lower ratings go directly to the team so we can put things right.</p><button class="btn" type="submit">Send private feedback</button><p id="status" aria-live="polite"></p></form><div id="thanks" class="hidden"><h1>Thank you</h1><p>Your private feedback has been received.</p><div id="next"></div></div></main><script src="assets/review-form.js"></script></body></html>
