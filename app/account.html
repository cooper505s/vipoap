<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5A8F5A"><title>My VIPOAP account</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="../assets/fonts.css"><style>:root{--g:#5a8f5a;--n:#102957;--c:#f7f3ec;--l:#dce5da;--m:#667085}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--n);font-family:Quicksand,"Segoe UI",sans-serif}.shell{max-width:760px;margin:auto;padding:18px}.top,.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;margin-bottom:16px}.top{display:flex;align-items:center;gap:12px}.top img{width:65px}.card h2{margin-top:0}.field{margin:12px 0}label{display:block;font-weight:800;margin-bottom:5px}input{width:100%;padding:13px;border:1px solid #bdcbb9;border-radius:11px;font:inherit}.btn{display:inline-block;border:0;border-radius:11px;background:var(--g);color:#fff;padding:12px 15px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.muted{color:var(--m)}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{border-top:1px solid var(--l);padding:12px 0}.pill{display:inline-block;background:#eef5ec;border-radius:99px;padding:4px 8px;font-size:.8rem;font-weight:800}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><header class="top"><img src="../assets/vipoap-heart-transparent.png" alt=""><div><h1>My VIPOAP</h1><p class="muted">Technology without the worry</p></div></header><section id="login" class="card"><h2>Sign in</h2><p>We’ll email you a six-digit code. You do not need to remember a password.</p><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email"></div><div id="codeField" class="field hidden"><label for="code">Six-digit code</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><button class="btn" id="continue">Send sign-in code</button><p id="loginStatus" aria-live="polite"></p></section><section id="account" class="hidden"><section class="card"><h2 id="welcome">Welcome</h2><p><a class="btn" href="./#book">Book help</a> <button class="btn" id="signout">Sign out</button></p></section><div class="grid"><section class="card"><h2>Membership</h2><div id="membership"></div></section><section class="card"><h2>Family permissions</h2><div id="family"></div></section></div><section class="card"><h2>Appointments</h2><div id="appointments"></div></section><section class="card"><h2>Equipment</h2><div id="equipment"></div></section><section class="card"><h2>Receipts</h2><div id="receipts"></div></section></section></main><script src="account-help.js"></script><script>let token=localStorage.getItem('vipoapCustomerSession')||'',waiting=false;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),empty=t=>`<p class="muted">${t}</p>`;async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}async function load(){const r=await fetch('/api/account/overview',{headers:{'x-customer-session':token}}),data=await r.json();if(!r.ok){const error=Error(data.error||'Please sign in.');error.status=r.status;throw error}$('login').classList.add('hidden');$('account').classList.remove('hidden');$('welcome').textContent=`Welcome, ${data.customer.name}`;const e=data.entitlement;$('membership').innerHTML=e?.active?`<p><span class="pill">${esc(e.plan)}</span></p><p><strong>${e.minutesRemaining} minutes</strong> of remote help left until ${esc(e.period.end)}.</p><p>Unused minutes do not roll over.</p>`:empty('Pay As You Go');$('family').innerHTML=data.delegatedAccess.length?data.delegatedAccess.map(x=>`<article class="item"><strong>${esc(x.status)}</strong><p>${x.permissions.map(esc).join(', ')}</p></article>`).join(''):empty('No delegated access is currently active.');$('appointments').innerHTML=data.appointments.length?data.appointments.map(x=>`<article class="item"><strong>${esc(x.date)} at ${esc(x.time)}</strong><p>${esc(x.service)} · ${esc(x.bookingStatus||x.status)} · ${esc(x.paymentStatus||'')}</p></article>`).join(''):empty('No appointments yet.');$('equipment').innerHTML=data.equipment.length?data.equipment.map(x=>`<article class="item"><strong>${esc(x.productName)}</strong><p>${esc(x.reason)} · £${Number(x.total).toFixed(2)} · ${esc(x.status)}</p></article>`).join(''):empty('No equipment recommendations.');$('receipts').innerHTML=data.receipts.length?data.receipts.map(x=>`<article class="item"><strong>${esc(x.number)}</strong><p>£${Number(x.total).toFixed(2)} · ${esc(x.status)}</p></article>`).join(''):empty('No receipts yet.')}$('continue').onclick=async()=>{const status=$('loginStatus');try{if(!waiting){await post('/api/account/auth/request',{email:$('email').value});waiting=true;$('codeField').classList.remove('hidden');$('continue').textContent='Sign in';status.textContent='If that account exists, the code is on its way.'}else{const data=await post('/api/account/auth/verify',{email:$('email').value,code:$('code').value});token=data.token;localStorage.setItem('vipoapCustomerSession',token);await load()}}catch(e){status.textContent=e.message}};$('signout').onclick=()=>{localStorage.removeItem('vipoapCustomerSession');location.reload()};if(token)load().catch(error=>{if(error.status===401||error.status===403)localStorage.removeItem('vipoapCustomerSession');else loginStatus.textContent='Your saved sign-in is being kept. Reconnect to load your account.'});if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');</script><script src="../assets/connectivity.js"></script></body></html>
