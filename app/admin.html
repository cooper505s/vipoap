<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIPOAP Booking Admin</title><link rel="stylesheet" href="../assets/fonts.css"><style>:root{--g:#5A8F5A;--n:#102957;--c:#F7F3EC;--l:#DCE5DA}*{box-sizing:border-box}body{margin:0;background:var(--c);font:16px Nunito,"Segoe UI",Arial,sans-serif;color:var(--n)}main{max-width:760px;margin:40px auto;padding:24px}.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:22px;margin-bottom:18px}h1,h2{margin-top:0}label{display:block;font-weight:700;margin:12px 0 6px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px}textarea{min-height:220px;font-family:monospace}button{border:0;border-radius:12px;padding:13px 18px;background:var(--g);color:#fff;font-weight:700;cursor:pointer}.muted{color:#667085}.status{margin-top:12px;font-weight:700}</style></head><body><main><div class="card"><h1>VIPOAP booking availability</h1><p class="muted">Change the weekly availability or block individual dates. Times use the 24-hour format.</p><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password"><button id="load" style="margin-top:12px">Log in and load settings</button></div><div class="card" id="editor" hidden><h2>Availability settings</h2><p class="muted">Example: <code>"monday":[["19:00","21:00"]]</code></p><textarea id="json"></textarea><button id="save" style="margin-top:12px">Save availability</button><div class="status" id="status" aria-live="polite"></div></div></main><script>const endpoint='/api/admin/availability';async function request(method){const password=document.getElementById('password').value;if(!password)throw new Error('Enter the admin password.');const options={method,headers:{'x-admin-password':password,'content-type':'application/json'}};if(method==='POST')options.body=document.getElementById('json').value;const r=await fetch(endpoint,options);const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');return data}document.getElementById('load').onclick=async()=>{try{const data=await request('GET');document.getElementById('json').value=JSON.stringify(data,null,2);document.getElementById('editor').hidden=false}catch(e){alert(e.message)}};document.getElementById('save').onclick=async()=>{const s=document.getElementById('status');s.textContent='Saving…';try{JSON.parse(document.getElementById('json').value);await request('POST');s.textContent='Availability saved.'}catch(e){s.textContent=e.message}}</script></body></html>
