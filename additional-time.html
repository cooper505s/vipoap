<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Additional time approval | VIPOAP</title><link rel="stylesheet" href="assets/fonts.css"><link rel="stylesheet" href="assets/style.css"></head><body><main class="container" style="max-width:680px;padding:48px 20px"><section class="card"><img src="assets/vipoap-heart-transparent.png" alt="VIPOAP" style="width:110px"><h1>Approve additional time</h1><div id="request"><p>Loading your request…</p></div><p id="status" aria-live="polite"></p></section></main><script>const token=new URLSearchParams(location.search).get('token'),box=document.getElementById('request'),status=document.getElementById('status');async function load(){const response=await fetch('/api/additional-time-approval?token='+encodeURIComponent(token||'')),data=await response.json();if(!response.ok){box.textContent=data.error;return}box.innerHTML=`<p>Your VIPOAP Engineer Partner is asking for <strong>${data.minutes} additional minutes</strong>.</p><p>Additional charge after the appointment: <strong>£${Number(data.charge).toFixed(2)}</strong>.</p><p>You are free to approve or decline.</p><p><button class="btn primary" data-decision="approve">Approve extra time</button> <button class="btn secondary" data-decision="decline">Decline</button></p>`;box.querySelectorAll('[data-decision]').forEach(button=>button.onclick=()=>respond(button.dataset.decision))}async function respond(decision){box.querySelectorAll('button').forEach(button=>button.disabled=true);const response=await fetch('/api/additional-time-approval',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,decision})}),data=await response.json();status.textContent=response.ok?(decision==='approve'?'Additional time approved. It will be billed after the appointment.':'Additional time declined. No extra charge has been added.'):data.error}load();</script></body></html>
